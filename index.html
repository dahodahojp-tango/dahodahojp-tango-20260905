<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <title>単語帳</title>
  <link rel="stylesheet" href="style.css?v=20261103-priority-font3">
  <style>
    #studyScreen.active { grid-template-rows: 25px minmax(0, 1fr) 63px !important; }
    #studyScreen .action-bar { grid-template-columns: repeat(5, minmax(0, 1fr)); height: 63px !important; min-height: 63px !important; }
    #studyScreen .action-bar > .icon-button { height: 63px !important; min-height: 63px !important; }
    @media (max-width: 420px) {
      #studyScreen.active { grid-template-rows: 25px minmax(0, 1fr) 60px !important; }
      #studyScreen .action-bar, #studyScreen .action-bar > .icon-button { height: 60px !important; min-height: 60px !important; }
    }
  </style>
</head>
<body>
  <main id="app">
    <section id="homeScreen" class="screen active">
      <div id="bookButtons" class="book-buttons"></div>
      <div class="rate-setting">
        <div class="setting-item">
          <label for="questionRateSelect">出題率</label>
          <select id="questionRateSelect" aria-label="出題率">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5" selected>5</option><option value="6">6</option>
            <option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
          </select>
        </div>
      </div>
      <div class="home-tools">
        <button id="importButton" class="secondary">データ取込</button>
        <button id="refreshButton" class="secondary" type="button">画面更新 ↻</button>
      </div>
      <div id="homeMessage" class="message"></div>
    </section>
    <section id="studyScreen" class="screen">
      <header class="study-header">
        <div class="study-status">
          <span id="importantIndicator" class="important-indicator" aria-label="重要問題" hidden>⚛️</span>
          <div id="progressText" class="progress">0 / 0</div>
        </div>
        <div class="study-font-controls" aria-label="文字サイズ変更">
          <button id="fontDownButton" type="button" aria-label="文字を小さく">－</button>
          <button id="fontUpButton" type="button" aria-label="文字を大きく">＋</button>
        </div>
      </header>
      <div id="card" class="card" role="button" tabindex="0" aria-label="問題と答えを切り替える">
        <div id="cardText" class="card-text"></div>
      </div>
      <nav class="action-bar">
        <button id="topButton" class="icon-button" aria-label="ホームに戻る"><span class="icon home-icon">🔝</span></button>
        <button id="deleteButton" class="icon-button" aria-label="この問題を削除"><span class="icon">🗑️</span></button>
        <button id="importantButton" class="icon-button important" aria-label="重要問題"><span class="icon">⚛️</span></button>
        <button id="wrongButton" class="icon-button wrong" aria-label="不正解"><span class="icon">❎</span></button>
        <button id="correctButton" class="icon-button correct" aria-label="正解"><span class="icon">✅</span></button>
      </nav>
    </section>
  </main>
  <dialog id="importDialog">
    <form method="dialog">
      <h2>データ取込</h2>
      <p>GitHub上の5列CSVを読み込み、選んだ単語帳のデータをすべて入れ替えます。学習履歴もCSVから復元します。</p>
      <div id="importChoices" class="dialog-buttons"></div>
      <button value="cancel" class="secondary">キャンセル</button>
    </form>
  </dialog>
  <dialog id="csvExportDialog">
    <div>
      <h2>CSVダウンロード</h2>
      <p>このスマホに取り込んだ問題から、削除済みの問題をまとめて除いてCSVを保存します。GitHubへのアップロードは後で手動で行ってください。</p>
      <div id="csvExportChoices" class="dialog-buttons"></div>
      <p id="csvExportMessage" role="status" aria-live="polite"></p>
      <button type="button" class="secondary" onclick="document.getElementById('csvExportDialog').close()">閉じる</button>
    </div>
  </dialog>
  <script src="app.js?v=20261103-priority-font3"></script>
</body>
</html>
