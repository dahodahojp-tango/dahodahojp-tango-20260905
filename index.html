<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <title>単語帳</title>
  <link rel="stylesheet" href="style.css?v=20260906-2">
</head>
<body>
  <main id="app">
    <section id="homeScreen" class="screen active">
      <div id="bookButtons" class="book-buttons"></div>

      <div class="rate-setting">
        <label for="questionRateSelect">出題率</label>
        <select id="questionRateSelect" aria-label="出題率">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5" selected>5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>
      </div>

      <div class="home-tools">
        <button id="importButton" class="secondary">データ取込</button>
        <button id="resetButton" class="danger-outline">データ初期化</button>
      </div>

      <div id="homeMessage" class="message"></div>
    </section>

    <section id="studyScreen" class="screen">
      <header class="study-header">
        <div class="study-status">
          <span id="importantIndicator" class="important-indicator" aria-label="重要問題" hidden>⚛️</span>
          <div id="progressText" class="progress">0 / 0</div>
        </div>
        <div class="font-buttons">
          <button id="fontDownButton" aria-label="文字を小さく">－</button>
          <button id="fontUpButton" aria-label="文字を大きく">＋</button>
        </div>
      </header>

      <div id="card" class="card" role="button" tabindex="0" aria-label="問題と答えを切り替える">
        <div id="cardText" class="card-text"></div>
        <div class="hint">タップ／左右スワイプで問題・答え切替</div>
      </div>

      <nav class="action-bar">
        <button id="importantButton" class="icon-button important" aria-label="重要問題">
          <span class="icon">⚛️</span>
        </button>
        <button id="topButton" class="icon-button" aria-label="トップへ戻る">
          <span class="icon home-icon">🔝</span>
        </button>
        <button id="deleteButton" class="icon-button" aria-label="この問題を削除">
          <span class="icon">🗑️</span>
        </button>
        <button id="correctButton" class="icon-button correct" aria-label="正解">
          <span class="icon">✅</span>
        </button>
        <button id="wrongButton" class="icon-button wrong" aria-label="不正解">
          <span class="icon">❎</span>
        </button>
      </nav>
    </section>
  </main>

  <dialog id="importDialog">
    <form method="dialog">
      <h2>データ取込</h2>
      <p>GitHub上のCSVから、新しいIDだけをiPhoneに追加します。</p>
      <div id="importChoices" class="dialog-buttons"></div>
      <button value="cancel" class="secondary">キャンセル</button>
    </form>
  </dialog>

  <dialog id="resetDialog">
    <form method="dialog">
      <h2>データ初期化</h2>
      <p>選んだ単語帳の問題、学習回数、正解回数、削除済み記録をすべて消します。</p>
      <div id="resetChoices" class="dialog-buttons"></div>
      <button id="resetAllButton" value="all" class="danger">全部初期化</button>
      <button value="cancel" class="secondary">キャンセル</button>
    </form>
  </dialog>

  <script src="app.js?v=20260906-2"></script>
</body>
</html>
